data:
  quote_databases:
    - symbol: MIX
      path: 'C:\Users\Alkor\gd\data_quote_db\MIX_futures_day_2025_21-00.db'
    - symbol: RTS
      path: 'C:\Users\Alkor\gd\data_quote_db\RTS_futures_day_2025_21-00.db'
    - symbol: Si
      path: 'C:\Users\Alkor\gd\data_quote_db\Si_futures_day_2025_21-00.db'

markov:
  lookback: 20
  bull_threshold: 0.05
  bear_threshold: -0.05

  # Минимум размеченных режимов до начала walk-forward сигналов.
  # 252 ближе к одному торговому году, но для текущих годовых БД после lookback
  # сигналов почти не остается. Для первого рабочего прогона используем 60.
  min_train: 60

  # Масштаб для proportional-позиции: signal / signal_scale.
  signal_scale: 1.0

backtest:
  # Сделка открывается, только если abs(mm_signal) больше этого порога.
  entry_threshold: 0.0

  # Издержки задаются в долях капитала на сделку.
  commission: 0.0
  slippage: 0.0

output:
  # После каждого запуска здесь появятся pkl/json/html артефакты.
  directory: artifacts
  save_artifacts: true
